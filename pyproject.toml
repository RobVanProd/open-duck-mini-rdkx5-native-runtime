[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-duck-x5-runtime"
version = "0.1.0"
description = "Deterministic, measurement-first Open Duck Mini runtime for RDK-X5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
policy = ["onnxruntime>=1.18,<2"]
hardware = ["smbus2>=0.4.3,<1", "pygame>=2.6,<3"]
dev = ["pytest>=8,<9", "jsonschema>=4.22,<5", "ruff>=0.6,<1"]

[project.scripts]
runtime_timing_probe = "open_duck_x5.probe:main"
open_duck_x5_runtime = "open_duck_x5.runtime:main"
configure_motor = "open_duck_x5.tools.configure_motor:main"
check_motors = "open_duck_x5.tools.check_motors:main"
find_soft_offsets = "open_duck_x5.tools.find_soft_offsets:main"
set_servo_mid = "open_duck_x5.tools.set_servo_mid:main"
verify_contract_snapshot = "open_duck_x5.contract_snapshot:main"
extract_contract_snapshot = "open_duck_x5.legacy_contract:main"
probe_single_servo = "open_duck_x5.single_servo_probe:main"
probe_sensors = "open_duck_x5.sensor_probe:main"
collect_duck_evidence = "open_duck_x5.evidence_collector:main"
summarize_control_run = "open_duck_x5.control_summary:main"
analyze_usbmon_latency = "open_duck_x5.usbmon_analysis:main"
probe_servo_voltage = "open_duck_x5.voltage_probe:main"
probe_servo_voltage_limits = "open_duck_x5.voltage_limit_probe:main"
configure_servo_voltage_limits = "open_duck_x5.voltage_limit_config:main"
analyze_collector_trace = "open_duck_x5.collector_trace_analysis:main"
benchmark_fixed_frame = "open_duck_x5.fixed_frame_benchmark:main"
convert_imu_calibration = "open_duck_x5.imu_calibration:main"
validate_gate3_sensors = "open_duck_x5.gate3_validation:main"
validate_gate3_label = "open_duck_x5.gate3_validation:label_main"
calibrate_imu = "open_duck_x5.imu_calibration_capture:main"
validate_imu_calibration = "open_duck_x5.imu_calibration_review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
